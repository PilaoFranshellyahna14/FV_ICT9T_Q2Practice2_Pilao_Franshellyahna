<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Practice 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        h1{
            background-color: rgba(31, 3, 56, 0.94);
            color: rgb(255, 253, 253);
            box-shadow: 3px 3px 2px rgb(180, 171, 171);
        }

        body{
            background-image: url("https://img.magnific.com/free-vector/frightening-halloween-realistic-background_33099-1052.jpg?semt=ais_hybrid&w=740&q=80");
            background-size: cover;
            background-repeat: no-repeat;
        }

        #happyhalloween{
            height: 230px;
            width: 230px;
        }

        #head1{
            font-family: chiller;
            font-size: 30px;
            color: rgb(173, 201, 246);
        }

        #row2, #row3{
            font-family: chiller;
            font-size: 30px;
            color: rgb(255, 254, 253);
        }

        .col-lg-8{
            background-color: rgba(230, 248, 251, 0.83);
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="row justify-content-center">
            <h1 class="text-center">Halloween Party</h1>
        </div>

    </div>

    <br>

    <div class="row">
        <img class="img-fluid rounded-circle mx-auto d-block" src="https://media.istockphoto.com/id/1681769610/vector/halloween-cute-cartoon-card-with-funny-characters-ghost-pumpkin-star-and-typography-pink.jpg?s=612x612&w=0&k=20&c=KqIHmFRj0t9JRress0PgBLbcU4A-YAlt4hJlWGqbJmg=" id="happyhalloween" alt="happyhalloween">
    </div>

    <br>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <table class="table align-middle text-center">
                <thead>
                    <tr class="table table-hover" id="head1">
                        <th scope="col" style="width: 40%;">SATIRDAY</th>
                        <th scope="col" style="width: 20%;"> 31 </th>
                        <th scope="col  style="width: 40%;">OCTOBER</th>
                    </tr>
                </thead>

                <tbody>
                    <tr id="row2">
                        <td colspan="3">6:06 AM</td>
                    </tr>

                    <tr id="row3">
                        <td colspan="2">666 Avenue Bad Street Haunted Village, Death City</td>
                        <td>RSVP: 123 4567 8910</td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
